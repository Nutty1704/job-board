steps:
  - label: ":mag: Trunk check"
    key: trunk-check
    command: just trunk-check
    timeout_in_minutes: 10

  - label: ":snake: Test ingestion"
    key: ingestion-test
    command: just test-ingestion
    timeout_in_minutes: 10

  - label: ":snake: Test matching"
    key: matching-test
    command: just test-matching
    timeout_in_minutes: 10

  - label: ":terraform: Validate infrastructure"
    key: terraform-validate
    depends_on:
      - ingestion-test
      - matching-test
    command: |
      terraform -chdir=infra init -backend=false
      just terraform-fmt-check
      just terraform-validate
    timeout_in_minutes: 10

  - label: ":terraform: Plan"
    key: feature-terraform-plan
    depends_on: terraform-validate
    branches: "!main"
    command: |
      : "$${TF_STATE_BUCKET:?TF_STATE_BUCKET must be set in Buildkite.}"
      source scripts/configure-lambda-artifact-bucket.sh
      source scripts/configure-lambda-artifact-inputs.sh
      just terraform-init
      # Feature plans are never applied, so avoid taking a remote state lock
      # that a cancelled CI job could leave behind.
      terraform -chdir=infra plan -lock=false -out=feature.tfplan
      terraform -chdir=infra show -no-color feature.tfplan > feature-terraform-plan.txt
    artifact_paths:
      - infra/feature.tfplan
      - infra/feature-terraform-plan.txt
    plugins:
      - aws-assume-role-with-web-identity#v1.2.0:
          role-arn: $TERRAFORM_PLAN_ROLE_ARN
          session-tags:
            - organization_slug
            - pipeline_slug
            - build_branch
    timeout_in_minutes: 10

  - label: ":pipeline: Prepare deployment"
    key: prepare-deployment
    depends_on: terraform-validate
    branches: main
    command: bash scripts/buildkite-deployment-pipeline.sh
